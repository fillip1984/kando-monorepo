name: Build

on:
  push:
  pull_request:
    branches:
      - main
      - master
      - release/**
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
      - "chore/**"
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          cache: true
          run_install: true

      - name: Build
        run: pnpm run build
